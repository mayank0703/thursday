<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUESTION</title>
</head>
<style>
    .container {
        width: 80%;
        margin: 0 auto;
        padding: 20px;
        border: 3px solid #ff0000;
        background-color: #0c0c0c;
        border-radius: 5px;
        color: #fff;
        border-width: 5px;
        border-color: #ff0000;
        border-style: solid;
        box-sizing: border-box;
    }

    h1 {
        text-align: center;
    }

    p {
        text-align: center;
        font-size: 18px;
    }

    .span {
        display: inline-block;
        margin-top: 20px;
        margin-left: 500px;
        padding: 10px;
        font-style: italic;
        font-weight: bold;
        border: 2px solid #ff0000;
        text-align: center;
        color: #fff;
        background-color: #0c0c0c;
    }
</style>
<body>
    <div class="container">
        <h1>Question</h1>
        <p>What is the Block element in HTML?</p>
    </div>
    <span class="span">lore ipsum dolor sit amet</span>
</body>
</html>

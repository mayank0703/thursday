<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Css introduction</title>
    <link rel="stylesheet" href="css_selector.css" />
  </head>
  <body>
    <h1>Css introduction</h1>
    <p>lore ipsum dolor sit amet</p>
    <!-- use id to give a certain element a unique identifier -->
    <h2 id="css">Css selectors</h2>
    <p id="selector">This is a paragraph with a different color.</p>
    <br />
    <div class="property">
      <h3>Css properties</h3>
      <!-- id can be used to select one element but class can be used to select multiple elements, class is not unique but id  will always be unique -->
      <p>This is a paragraph with a different font size.</p>
      <br />
      <h4>Css pseudo-classes</h4>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    p {
        color: blue;
        font-size: 16px;
    }
    #highlighted {
        background-color: yellow;
        border: 1px solid black;
    }
    .footer-content {
        font-weight: bold;
        font-style: italic;
    }
</style>
<body>
    <header>
        <h1>Main title</h1>
    </header>
    <main>
        <section>
            <h2>Section title</h2>
            <p>This is a paragraph inside the section.</p>
        </section>
        <article>
            <h3>Article title</h3>
            <p id="highlighted">This is a paragraph highlighted inside the article.</p>
        </article>
    </main>
    <footer>
        <div class="footer-content">
            <p>Footer content goes here.</p>
        </div>
    </footer>
</body>
</html>
